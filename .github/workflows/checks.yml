name: LAB1 checks
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check tracked files and tests
        run: |
          python scripts/check_precommit.py --all
          python -m pytest -q
      - name: Manifest check if local data are present
        run: |
          python -m lab1.hashes verify --optional
