[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "lab1-ag-news-v39"
version = "1.0.0"
description = "Laboratory 1: Git hooks, reproducibility, EDA for AG News variant 39"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3", "numpy>=1.24,<3", "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1", "pydantic>=2.3,<3", "PyYAML>=6,<7",
  "datasets>=3.0,<5", "mlflow>=2.12,<5"
]
[project.optional-dependencies]
dev = ["pre-commit>=3.7,<5", "pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["lab1*"]
